version: '3.8'

services:
  backend:
    build: ./backend
    # volumes:
    #   - ./backend:/app
    container_name: backend
    environment:
      - NODE_ENV=production
    restart: unless-stopped

  frontend:
    build: ./frontend
    # volumes:
    #   - ./frontend:/app
    container_name: frontend
    environment:
      - NODE_ENV=development
    restart: unless-stopped
    depends_on:
      - backend
